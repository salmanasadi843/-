name: Verify Darsyar Release Signing

on:
  push:
    branches:
      - test/guard-empty-cloud-restore
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/verify-release-signature.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-release-signing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-release:
    name: Build and verify existing Release certificate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Restore existing signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.DARSYAR_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::DARSYAR_KEYSTORE_BASE64 is missing or unavailable."
            exit 1
          fi
          KEYSTORE_FILE="$RUNNER_TEMP/darsyar-upload-key.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Validate configured key alias
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.DARSYAR_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DARSYAR_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "${STORE_PASSWORD:-}"
          test -n "${KEY_ALIAS:-}"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "Configured alias exists in the restored keystore."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Build signed Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/darsyar-upload-key.jks
          STORE_PASSWORD: ${{ secrets.DARSYAR_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.DARSYAR_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DARSYAR_KEY_ALIAS }}
        run: gradle assembleRelease --stacktrace

      - name: Verify APK signature matches the previously installed Release
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose "$APK"
          EXPECTED="5a:f4:fe:44:a5:01:e2:89:6a:b3:61:f3:7d:05:14:a4:a3:31:99:82:7a:b8:f1:dc:42:b6:7f:bb:2c:61:6c:58"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]')"
          echo "Expected certificate SHA-256: $EXPECTED"
          echo "Actual certificate SHA-256:   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Release APK certificate does not match the previously installed app."
            exit 1
          fi
          echo "Release certificate matches the previously installed app."

      # Deliberately do not upload or publish this APK. This job verifies signing only.
