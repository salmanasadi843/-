name: Build Darsyar Web

on:
  push:
    branches: ["architecture/shared-backend-and-web", "feature/web-lecture-transcript-search"]
    paths:
      - "web/**"
      - ".github/workflows/web-build.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_DARSYAR_API_BASE_URL: ${{ vars.DARSYAR_STAGING_API_BASE_URL }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package.json
      - run: npm install
      - run: npm run build
      - name: Upload private web preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: darsyar-web-preview
          path: web/dist/
          if-no-files-found: error
          retention-days: 7
