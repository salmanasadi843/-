name: Build Darsyar Web

on:
  push:
    branches: ["architecture/shared-backend-and-web", "feature/web-lecture-transcript-search"]
    paths:
      - "web/**"
      - ".github/workflows/web-build.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package.json
      - run: npm install
      - run: npm run build
