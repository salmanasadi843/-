name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "firebase.emulator.json"
      - "firestore.emulator.rules"
      - ".github/workflows/build-apk.yml"
  push:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21 (Gradle and Firestore Emulator)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Run Android unit tests with Firestore Emulator
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: |
          timeout --signal=TERM --kill-after=30s 20m firebase emulators:exec --config firebase.emulator.json --project demo-darsyar-generation-tests --only auth,firestore "echo AUTH_ROOT_PROBE; curl -sS -o /tmp/auth-root-probe.txt -w AUTH_ROOT_HTTP=%{http_code} http://127.0.0.1:9099/; AUTH_SIGNUP_HTTP=\$(curl -sS -o /tmp/auth-signup-probe.json -w '%{http_code}' -H 'Content-Type: application/json' -d \"\$(printf %s eyJlbWFpbCI6InByb2JlQGV4YW1wbGUuaW52YWxpZCIsInBhc3N3b3JkIjoiVGVzdFBhc3MxMjMhIiwicmV0dXJuU2VjdXJlVG9rZW4iOnRydWV9 | base64 -d)\" 'http://127.0.0.1:9099/identitytoolkit.googleapis.com/v1/accounts:signUp?key=fake-emulator-api-key'); echo AUTH_SIGNUP_HTTP=\$AUTH_SIGNUP_HTTP; if [ \"\$AUTH_SIGNUP_HTTP\" != 200 ]; then cat /tmp/auth-signup-probe.json; exit 1; fi; node -e 'const x=require(\"/tmp/auth-signup-probe.json\"); console.log(\"AUTH_SIGNUP_LOCAL_ID_PRESENT=\"+Boolean(x.localId))'; gradle testDebugUnitTest --info --stacktrace"

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: firestore-emulator-test-diagnostics
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
            firestore-debug.log
          if-no-files-found: warn

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: ostadyar-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
