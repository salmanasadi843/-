name: Build Android APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.DARSYAR_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing or unavailable."
            exit 1
          fi
          KEYSTORE_FILE="$RUNNER_TEMP/darsyar-upload-key.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "::error::Decoded keystore file is empty."
            exit 1
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Validate signing credentials without modifying keystore
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/VerifyKeystore.java" <<'JAVA'
          import java.io.FileInputStream;
          import java.security.Key;
          import java.security.KeyStore;
          import java.security.PrivateKey;

          public class VerifyKeystore {
              public static void main(String[] args) throws Exception {
                  char[] storePassword = System.getenv("STORE_PASSWORD").toCharArray();
                  char[] keyPassword = System.getenv("KEY_PASSWORD").toCharArray();
                  KeyStore keyStore = KeyStore.getInstance("JKS");
                  try (FileInputStream input = new FileInputStream(System.getenv("KEYSTORE_PATH"))) {
                      keyStore.load(input, storePassword);
                  }
                  if (!keyStore.containsAlias("upload")) {
                      throw new IllegalStateException("Alias 'upload' is missing from the keystore.");
                  }
                  Key key = keyStore.getKey("upload", keyPassword);
                  if (!(key instanceof PrivateKey)) {
                      throw new IllegalStateException("Alias 'upload' does not contain a private key.");
                  }
                  System.out.println("Keystore password, alias, and private-key password are valid.");
              }
          }
          JAVA
          javac "$RUNNER_TEMP/VerifyKeystore.java"
          java -cp "$RUNNER_TEMP" VerifyKeystore

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Build signed Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/darsyar-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v6
        with:
          name: darsyar-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
