name: Build Android APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Run Android unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Prepare the existing upload keystore
        shell: bash
        env:
          DARSYAR_KEYSTORE_BASE64: ${{ secrets.DARSYAR_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$DARSYAR_KEYSTORE_BASE64" || { echo "Missing DARSYAR_KEYSTORE_BASE64 secret"; exit 1; }
          KEYSTORE_PATH="$RUNNER_TEMP/darsyar-upload-key.jks"
          printf '%s' "$DARSYAR_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build APK signed with the existing upload key
        env:
          STORE_PASSWORD: ${{ secrets.DARSYAR_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.DARSYAR_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DARSYAR_KEY_ALIAS }}
        run: gradle assembleRelease --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          APK_SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$APK_SIGNER"
          "$APK_SIGNER" verify --verbose "$APK"
          "$APK_SIGNER" verify --print-certs "$APK"

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v6
        with:
          name: darsyar-release-signed-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
