name: Legacy Inventory Validator Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/legacy_inventory/**"
      - ".github/workflows/legacy-inventory-tests.yml"
  push:
    branches: ["architecture/shared-backend-and-web"]
    paths:
      - "tools/legacy_inventory/**"
      - ".github/workflows/legacy-inventory-tests.yml"

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run synthetic read-only tests
        run: python -m unittest discover -s tools/legacy_inventory -p 'test_*.py' -v
