name: Firestore Rules Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle for Android integration test
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"
      - name: Install rules test dependencies
        working-directory: tools/firestore-rules-tests
        run: npm install --no-audit --no-fund
      - name: Run Firestore Emulator rules tests
        working-directory: tools/firestore-rules-tests
        run: npm run test:rules
      - name: Run Android admin restore/export integration test on Firestore Emulator
        working-directory: tools/firestore-rules-tests
        run: npm run test:restore
