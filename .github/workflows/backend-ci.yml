name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: darsyar_staging
          POSTGRES_USER: darsyar_ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darsyar_ci -d darsyar_staging"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"
      - name: Run backend unit tests
        run: gradle -p backend test
      - name: Build backend distribution
        run: gradle -p backend installDist
      - name: Start backend against disposable PostgreSQL
        env:
          DB_URL: jdbc:postgresql://localhost:5432/darsyar_staging
          DB_USER: darsyar_ci
          DB_PASSWORD: ci_only_password
          HOST: 127.0.0.1
          PORT: 8080
        run: |
          backend/build/install/darsyar-backend/bin/darsyar-backend > /tmp/darsyar-backend.log 2>&1 &
          echo $! > /tmp/darsyar-backend.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8080/health/ready; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/darsyar-backend.log
          exit 1
      - name: Verify liveness and API version
        run: |
          curl --fail --silent http://127.0.0.1:8080/health/live
          curl --fail --silent http://127.0.0.1:8080/api/v1
