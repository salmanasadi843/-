name: Diagnose Darsyar Release APK Installability

on:
  push:
    branches:
      - diagnose/release-apk-installability
    paths:
      - ".github/workflows/diagnose-release-apk-installability.yml"
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnose-release-apk-installability
  cancel-in-progress: true

jobs:
  build-and-install:
    name: Build, validate, and install on Android 12 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK 36 tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Restore the existing Darsyar signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.DARSYAR_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64:-}" || { echo "::error::DARSYAR_KEYSTORE_BASE64 is missing"; exit 1; }
          KEYSTORE_FILE="$RUNNER_TEMP/darsyar-upload-key.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Validate signing credentials
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.DARSYAR_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DARSYAR_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "${STORE_PASSWORD:-}"
          test -n "${KEY_ALIAS:-}"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "Signing key alias is accessible."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Build signed Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/darsyar-upload-key.jks
          STORE_PASSWORD: ${{ secrets.DARSYAR_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.DARSYAR_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DARSYAR_KEY_ALIAS }}
        run: gradle assembleRelease --stacktrace

      - name: Validate APK signature, alignment, and package metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/apksigner" verify --verbose "$APK"
          "$TOOLS/zipalign" -c -v 4 "$APK"
          "$TOOLS/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -q "package: name='com.aistudio.lecturehub.kqmzv'" "$RUNNER_TEMP/apk-badging.txt"
          sha256sum "$APK"

      - name: Install and launch APK on Android 12 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell pm path com.aistudio.lecturehub.kqmzv
            adb shell dumpsys package com.aistudio.lecturehub.kqmzv | grep -E "versionCode=|versionName=|targetSdk="
            adb shell monkey -p com.aistudio.lecturehub.kqmzv 1

      - name: Upload tested APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: darsyar-release-apk-android12-install-tested
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
